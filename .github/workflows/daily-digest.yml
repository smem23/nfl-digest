name: NFL Daily Digest

on:
  schedule:
    # Target: 10:00 Europe/Dublin, every day. Cron runs in UTC with no DST, so
    # both entries are declared — 09:00 UTC is 10:00 Dublin in summer (IST),
    # 10:00 UTC is 10:00 Dublin in winter (GMT). The page is small and cheap to
    # rebuild, so both runs redeploy it; the page is always fresh by 10:00 local.
    - cron: "0 9 * * *"
    - cron: "0 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nfl-digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build the page
        run: python digest.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
