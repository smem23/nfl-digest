name: NFL Daily Digest

on:
  schedule:
    # Target: 11:00 Europe/Dublin. Cron runs in UTC with no DST handling, so we
    # fire twice — 10:00 UTC (Irish Summer Time, UTC+1) and 11:00 UTC (winter,
    # UTC+0). The page is rebuilt on both runs; digest.py only *emails* on the
    # run that lands at 11:00 Dublin local time.
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nfl-digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build the page
        env:
          DIGEST_SEND_EMAIL: "0"
        run: python digest.py

      - name: Send the digest email
        continue-on-error: true
        env:
          DIGEST_WRITE_PAGE: "0"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: python digest.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
